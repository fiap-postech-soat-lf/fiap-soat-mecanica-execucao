spring.application.name=mecanica-execucao
spring.threads.virtual.enabled=true
server.forward-headers-strategy=framework
app.versao=${DD_VERSION:dev}

# Actuator (health com probes, como no monolito)
management.endpoint.health.probes.enabled=true
management.endpoints.web.exposure.include=health,info
management.otlp.metrics.export.url=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/metrics
management.otlp.metrics.export.enabled=${METRICS_EXPORT_ENABLED:true}
management.metrics.tags.service=${spring.application.name}

# Logs (do monolito)
logging.level.br.com.fiap.soat.mecanica=INFO
logging.structured.format.console=logstash
logging.structured.json.add.service=${spring.application.name}

# JWT (RS256, emitido pelo Identity)
app.security.jwt.public-key=${JWT_PUBLIC_KEY:}
app.security.jwt.issuer=fiap-soat-mecanica-identity
app.security.jwt.audience=fiap-soat-mecanica

# AWS e mensageria (valores do ConfigMap gerado pelo output app_config do Terraform)
app.aws.region=${AWS_REGION:us-east-1}
app.aws.endpoint=${AWS_ENDPOINT_URL:}
app.messaging.consumidor.enabled=true
# URLs separadas por virgula; no EKS chegam como APP_MESSAGING_CONSUMIDOR_FILAS e APP_MESSAGING_DLQS
app.messaging.consumidor.filas=
app.messaging.dlqs=
# Destinos de publicacao (ARN de topico ou URL de fila), um por nome logico
app.messaging.destinos.execucao-eventos=${MESSAGING_DESTINO_EXECUCAO_EVENTOS:}


# DynamoDB (RFC-F4-02): nomes fixos das 6 tabelas, criadas pelo infra/ do servico
app.dynamo.tabelas.ordens=execucao-ordens
app.dynamo.tabelas.pecas=execucao-pecas
app.dynamo.tabelas.reservas=execucao-reservas
app.dynamo.tabelas.outbox=execucao-outbox
app.dynamo.tabelas.idempotencia=execucao-idempotencia
app.dynamo.tabelas.tempos=execucao-tempos

# Outbox (F5-i) e idempotencia (F5-g)
app.outbox.lease=PT30S
app.outbox.lote=25
app.outbox.ttl-publicada=P1D
app.idempotencia.ttl=P7D

# Catalogo de servicos do OS (DNS do cluster, sem passar pelo API Gateway), retry (F4-c) e cache (F5-o)
app.os.base-url=${APP_OS_BASE_URL:}
app.os.retry.max-tentativas=3
app.os.retry.espera-inicial=200ms
app.os.retry.multiplicador=2
app.os.catalogo.cache-ttl=PT5M

# Seed das 3 pecas do V9 (F5-l)
app.seed.pecas.enabled=true
